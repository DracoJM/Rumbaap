name: rumbaap
description: "Rumbaap."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

# Sin dependencias externas de ejecución (docs/decisions/0001-base-app-flutter.md).
dependencies:
  flutter:
    sdk: flutter
  # Solo persistencia LOCAL de datos ficticios de la demo (aprobado por
  # Juanmi, 2026-10-11). No es el almacenamiento de producción. Versión fija:
  # 2.5.6 exige Flutter 3.41 / Dart 3.11.
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
