name: rumbaap
description: "Rumbaap."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

# Dependencias externas: solo las aprobadas, con su motivo (CLAUDE.md §8).
dependencies:
  flutter:
    sdk: flutter
  # Solo persistencia LOCAL de datos ficticios de la demo (aprobado por
  # Juanmi, 2026-10-11). No es el almacenamiento de producción. Versión fija:
  # 2.5.6 exige Flutter 3.41 / Dart 3.11.
  shared_preferences: 2.5.5
  # QR real de la credencial y lectura con cámara del personal (aprobado por
  # Juanmi, 2026-10-11). Versiones fijas, comprobadas con Flutter 3.35.2 /
  # Dart 3.9. mobile_scanner usa ML Kit incluido en Android (sin descarga) y
  # Apple Vision en iOS.
  mobile_scanner: 7.4.2
  qr_flutter: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
